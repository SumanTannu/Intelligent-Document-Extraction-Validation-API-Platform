services:
  - type: web
    name: tannu-intellidoc-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tannu-intellidoc-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://tannu-intellidoc-frontend.onrender.com
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_MAX_COMPLETION_TOKENS
        value: "4096"
      - key: LLM_API_KEY
        sync: false
      - key: OCR_MULTI_PASS
        value: "true"

  - type: web
    name: tannu-intellidoc-frontend
    runtime: static
    buildCommand: echo "Static frontend ready"
    staticPublishPath: ./frontend
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /documents/*
        destination: /document_result.html

databases:
  - name: tannu-intellidoc-db
    plan: free
    region: singapore
