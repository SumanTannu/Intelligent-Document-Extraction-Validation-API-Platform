services:
  - type: web
    name: tannu-intelligent-document-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tannu-intellidoc-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_MAX_COMPLETION_TOKENS
        value: "4096"
      - key: LLM_API_KEY
        sync: false
      - key: OCR_MULTI_PASS
        value: "true"

databases:
  - name: tannu-intellidoc-db
    plan: free
    region: singapore
