server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~ ^/documents/[^/]+$ {
        try_files /document_result.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
